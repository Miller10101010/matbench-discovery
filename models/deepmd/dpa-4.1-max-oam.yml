    bf16_amp: true
    tf32_matmul: true
notes:
  submission_status: Draft prepared for colleague review before the model owner makes
    the official submission. Public artifact URLs remain pending. The Python 3.14
    shared-runner environment remains under validation.
  metadata_provenance: At the submitter's direction, authors, trained_by, checkpoint
    license, training task and targets follow dpa-4.0.1-pro-mptrj.yml. The submitter
    confirms training on MPtrj, OMat24 and sAlex, with OSOD openness. Model-specific
    hyperparameters are extracted from each original checkpoint using only keys in
    that reference card. The old model's training costs, learning-rate schedule and
    loss settings are not copied.
  training_metadata: training_steps is the displayed step of the submitted checkpoint
    (PT stores a zero-based counter; PT-expt stores the displayed counter), not a
    planned schedule length. The saved optimizer groups match HybridMuon. GPU count,
    training hours, batch size, learning-rate schedule and loss weights are not recorded
    in the supplied checkpoints and are omitted. Full model configuration remains
    embedded in each inference checkpoint.
  prediction_provenance: Discovery and phonon predictions were supplied in the model
    submission directory and re-evaluated with Matbench Discovery commit 2b7bff925a6aff10240cf6ef0f59149f51adff7b.
    Canonical schema conversion preserves physical predictions.
  geometry_metadata: Historical per-structure convergence flags and optimization step
    counts were not supplied. These are recorded as null. The historical cell filter
    still needs confirmation.
  release_checkpoint: 'Inference-only checkpoint copy: optimizer, auxiliary EMA state
    and training history removed. All model tensors and the model configuration are
    identical to the original checkpoint, and strict model loading passed. The original
    top-level model weights are retained without EMA substitution. This is a checkpoint,
    not a frozen export. Source SHA256: a60624085255340a43c8b6a82428a7b414280cf02edb06dcab286bfe4614c9d2.
    Release SHA256: fb19a96ef950e7853aca2cabaee1aa3b72e54f6d5e307732523f5be8aa3bdf78.'
  discovery_protocol: Supplied workflow logs record FIRE, max_force=0.02 eV/angstrom,
    max_steps=500 and DP_TRITON_INFER=0. Cell-filter settings and per-structure convergence/step
    records are not recoverable from the supplied files.
  additional_benchmarks: 'Reused existing identical-checkpoint results: 17 complete
    20 ps NVT trajectories and 92 homonuclear curves (87 scored elements). Artifact
    identity, full trajectory coverage, reference identity, per-system versus aggregate
    MD results, and current metric aggregation were audited. Diatomic curves were
    rescored with current PBE references. No new inference or independent recomputation
    of every MD observable was performed. MD energy/force RMSE requiring private labels
    is unavailable.'
  timing_provenance: Reuse measured RTX PRO 6000 timings as explicitly approved by
    user; no conversion to A800/H100/H200.
  validation_limitations: Diatomic frozen/eager precision parity failed for some extreme
    short-range curves; source diagnostics are preserved without excluding those elements.
  historical_md_diatomic_environment: Reported MD and diatomic results were measured
    on NVIDIA RTX PRO 6000 Blackwell Server Edition, with Python 3.13 and Torch 2.13.0+cu130.
    Original per-run manifests preserve the DeepMD package/source revisions. The declared
    Python 3.14 environment is a separate reproduction candidate; its performance
    has not been substituted for historical measurements.
  diatomic_short_range_behavior: Very large short-range diatomic errors are retained
    in the official aggregates, including Ne-dominated energy/force errors. The source
    workspace includes selected FP64 and finite-difference diagnostics that also reproduce
    anomalies; these diagnostics do not establish numerical parity for all 92 curves.
    No outlier elements were removed and no diagnostic curves replaced the historically
    evaluated FP32 curves.
